[package]
name = "alloy-eval"
description = "Alloy eval harness and holdout gates (RFC-0016)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
# Live ControlPlane stack driver (RFC-0016 §5.9): scheduler + Landlock sandbox +
# MCP cargo_check + GitEditEngine + GenerationDriver. Integration smoke over
# committed recordings/* worker JSON (not thesis citation — needs independent
# model outputs). Default `cargo test -p alloy-eval` stays offline (no alloy-tools).
stack-driver = ["dep:alloy-tools", "dep:tempfile", "dep:alloy-index"]
# Live one-shot naive driver (E1 three-arm holdout, arm B): exactly one
# OpenAI-compatible completion, no tools, no index. Pulls in alloy-runtime's
# HTTP provider only when this feature is enabled; default builds stay offline.
live-naive = ["alloy-runtime/http-provider"]

[dependencies]
alloy-runtime = { workspace = true, default-features = false }
async-trait = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
alloy-tools = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
# Live stack-driver opens SqliteProjectGraph for DefaultContextEngine weight
# arms and WorkerDeps (parity with CLI assembly). Offline alloy-eval stays free
# of alloy-index.
alloy-index = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }
trybuild = { workspace = true }

[[bench]]
name = "fingerprint"
harness = false

[[bin]]
name = "alloy-eval-live-naive"
path = "src/bin/alloy-eval-live-naive.rs"
required-features = ["live-naive"]

[[test]]
name = "live_naive_runner"
required-features = ["live-naive"]
