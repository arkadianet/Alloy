[package]
name = "alloy-eval"
description = "Alloy eval harness and holdout gates (RFC-0016)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
# Live ControlPlane stack driver (RFC-0016 §5.9): scheduler + Landlock sandbox +
# MCP cargo_check + GitEditEngine + GenerationDriver. Thesis citation requires
# this feature; the default build stays offline and free of alloy-tools.
stack-driver = ["dep:alloy-tools", "dep:tempfile"]

[dependencies]
alloy-runtime = { workspace = true, default-features = false }
async-trait = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
alloy-tools = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }
trybuild = { workspace = true }

[[bench]]
name = "fingerprint"
harness = false
