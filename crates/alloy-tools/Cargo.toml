[package]
name = "alloy-tools"
description = "Alloy MCP host and sandbox tooling (RFC-0005 sandbox broker)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
# Test-only hooks (never enable in release profiles).
test-hooks = []

[dependencies]
alloy-runtime = { workspace = true }
async-trait = { workspace = true }
globset = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "sandbox_rfc0005"
required-features = ["test-hooks"]
path = "tests/sandbox_rfc0005.rs"
