[package]
name = "alloy-tools"
description = "Alloy MCP host and sandbox tooling (RFC-0005 sandbox broker)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []

[dependencies]
alloy-runtime = { workspace = true, features = ["http-provider"] }
async-trait = { workspace = true }
globset = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }

[dev-dependencies]
# RFC-0013 T20: the scheduler e2e drives the real capability registry with
# alloy-eval's ScriptedProvider (rule C2: dev-dependency only, no cycle).
alloy-eval = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }

[[test]]
name = "sandbox_rfc0005"
path = "tests/sandbox_rfc0005.rs"

[[test]]
name = "mcp_rfc0006"
path = "tests/mcp_rfc0006.rs"

[[test]]
name = "edit_rfc0008"
path = "tests/edit_rfc0008.rs"

[[test]]
name = "edit_failpoints"
path = "tests/edit_failpoints.rs"

# Not RFC-scoped by design: proves the merged subsystems compose.
[[test]]
name = "cross_subsystem"
path = "tests/cross_subsystem.rs"
