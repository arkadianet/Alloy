[package]
name = "alloy-cli"
description = "Alloy command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "alloy"
path = "src/main.rs"

# RFC-0015 T9: dependencies stay a subset of
# {alloy-runtime, alloy-tools, alloy-index, clap, tokio, tracing, serde_json,
#  anyhow-or-equivalent}. No HTTP client, no TOML parser of its own.
[dependencies]
alloy-runtime = { workspace = true, features = ["http-provider"] }
alloy-tools = { path = "../alloy-tools" }
alloy-index = { path = "../alloy-index" }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
alloy-runtime = { workspace = true, features = ["http-provider"] }
tokio = { workspace = true }
# host_e2e only: SIGTERM the real binary without `unsafe`
# (Child::kill sends SIGKILL and would skip the drain path under test).
rustix = { workspace = true }
