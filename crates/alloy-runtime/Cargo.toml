[package]
name = "alloy-runtime"
description = "Alloy runtime host and shared IR"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["http-provider"]
# OpenAI-compatible HTTP provider (reqwest + rustls). Traits/recording compile without it.
http-provider = ["dep:reqwest", "dep:rustls"]

[dependencies]
async-trait = { workspace = true }
hex = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
scopeguard = { workspace = true }
zeroize = { workspace = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
wiremock = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
tokio-rustls = { workspace = true }

[[test]]
name = "router_rfc0007"
required-features = ["http-provider"]

[[bench]]
name = "digest_sha256"
harness = false

[[bench]]
name = "storage_append"
harness = false

[[bench]]
name = "obs_cost_redact"
harness = false

[[bench]]
name = "router_select"
harness = false
