[workspace]
resolver = "2"
members = [
    "crates/alloy-cli",
    "crates/alloy-runtime",
    "crates/alloy-tools",
    "crates/alloy-index",
    "crates/alloy-eval",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["arkadianet"]
repository = "https://github.com/arkadianet/Alloy"
rust-version = "1.97"

[workspace.dependencies]
# Dependents opt into `http-provider` explicitly so offline crates (alloy-eval)
# never link reqwest (RFC-0016 §10.1).
alloy-runtime = { path = "crates/alloy-runtime", default-features = false }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["serde", "serde-human-readable", "formatting", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal", "process", "io-util", "test-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio"] }
trybuild = "1"
assert_cmd = "2"
predicates = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
globset = "0.4"
rustix = { version = "0.38", features = ["process", "fs", "thread", "mount", "net", "stdio", "pipe"] }
libc = "0.2"
landlock = "0.4"
# RFC-0007: pinned for first TLS/HTTP review reproducibility (§10.1).
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "system-proxy", "http2", "charset", "stream"] }
url = "2.5.8"
# Direct pin matching reqwest 0.13.4's transitive rustls (downcast for TLS classification).
rustls = "=0.23.42"
wiremock = "0.6"
scopeguard = "1"
rcgen = "0.13"
tokio-rustls = "0.26"
zeroize = { version = "1" }
regex = "1"
