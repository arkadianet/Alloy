# RFC-0005 Sandbox Broker CI

name: sandbox

on:
  push:
    paths:
      - "crates/alloy-tools/**"
      - "crates/alloy-runtime/**"
      - "profiles/**"
      - "docs/security/sandbox-residual-risk.md"
      - ".github/workflows/sandbox.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "crates/alloy-tools/**"
      - "crates/alloy-runtime/**"
      - "profiles/**"
      - "docs/security/sandbox-residual-risk.md"
      - ".github/workflows/sandbox.yml"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  linux-landlock:
    name: Linux Landlock (required)
    runs-on: ubuntu-latest
    env:
      # Fail closed: Unavailable Landlock must fail the job, not skip green.
      ALLOY_REQUIRE_LANDLOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Enable unprivileged user namespaces
        run: |
          # ubuntu-24.04 defaults to apparmor_restrict_unprivileged_userns=1,
          # which makes Landlock+userns probes Unavailable and fails the suite.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -f /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
      - name: Test alloy-tools
        run: cargo test -p alloy-tools --features test-hooks -- --nocapture
      - name: Require Landlock enforcement test ran
        run: |
          cargo test -p alloy-tools --features test-hooks --test sandbox_rfc0005 landlock_actually_applied -- --nocapture --exact
      - name: Clippy (deny warnings)
        run: cargo clippy -p alloy-tools --all-targets --features test-hooks -- -D warnings
      - name: Fmt
        run: cargo fmt --all -- --check

  macos-seatbelt:
    name: macOS Seatbelt (compile + test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Compile alloy-tools (required — Seatbelt must build)
        run: cargo check -p alloy-tools --features test-hooks
      - name: Test alloy-tools (Seatbelt enforcement)
        run: cargo test -p alloy-tools --features test-hooks -- --nocapture
      - name: Require Seatbelt enforcement test ran
        run: |
          cargo test -p alloy-tools --features test-hooks --test sandbox_rfc0005 seatbelt_cargo_check_fixture -- --nocapture --exact
      - name: Clippy
        run: cargo clippy -p alloy-tools --all-targets --features test-hooks -- -D warnings

  container:
    name: Container backend (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Container smoke + probe tests
        # Matches container_* integration tests (probe + runtime smoke).
        # Job continues on error when docker/podman is missing; do not `|| true`
        # so real assertion failures still show as failed steps.
        run: cargo test -p alloy-tools --features test-hooks --test sandbox_rfc0005 container_ -- --nocapture
