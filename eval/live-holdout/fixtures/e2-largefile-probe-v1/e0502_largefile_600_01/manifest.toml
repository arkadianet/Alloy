# Live-holdout fixture manifest (corpus e2-largefile-probe-v1).
#
# The live harness reads exactly one field from this file: `naive_target_path`
# (crates/alloy-eval/src/live_holdout.rs, `HoldoutManifest`). Its deserializer
# accepts unknown keys, so everything below is provenance metadata that the
# harness ignores.
#
# Copy-fidelity probe: 24 audited golden repairs from e2-semantic-v1 composed
# verbatim (indented one level, wrapped in named modules) into one ~600-line
# crate, plus one small `pipeline` glue module authored for this probe. The
# only planted bug is the audited two-line E0502 from e0502_preserve_both_01,
# hosted in the `channel_updates` module. Every other module is untouched, and
# the hidden oracle asserts both the repair and the integrity of the untouched
# modules — collateral damage from whole-file regeneration must fail.

naive_target_path = "src/lib.rs"

id = "e0502_largefile_600_01"
corpus = "e2-largefile-probe-v1"
target_diagnostic = "E0502"
summary = "600-line composed crate with one two-line E0502 (shared borrow held across a capped write) planted in channel_updates; oracles cover the repair and every untouched module."

[license]
class = "permitted"
spdx = "Alloy-Original"
source_note = "Composed from the audited Alloy-original e2-semantic-v1 golden repairs by arkadianet; pipeline glue module authored for this probe."

[toolchain]
