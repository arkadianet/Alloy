# profiles/default.toml — Author: arkadianet
# Skeleton fields parsed by RFC-0001 RuntimeConfig::load (full profile wiring → RFC-0015).
[profile]
id = "default"

[budgets]
max_usd_per_run = 5.0
max_tokens_per_run = 2_000_000

[observability]
retain_full_prompts = false
retain_tool_bodies = false

# Sandbox (RFC-0005). On macOS set check = "seatbelt". Container is an acceptable fallback.
[sandbox]
check = "landlock"
test = "container"
network = "deny"
quarantine_deps = true
