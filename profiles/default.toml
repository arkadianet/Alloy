# profiles/default.toml — Author: arkadianet
# Architecture V2 Appendix B baseline. Parsed by RuntimeConfig::load (RFC-0015 §5.6 A1)
# and, for [sandbox], by alloy-tools load_sandbox_profile. Both readings are cross-checked
# at assembly (RFC-0015 CR6).
[profile]
id = "default"
description = "Correctness-first Rust profile"

[gates]
require_cargo_check = true            # MUST stay true in every profile (PF7)
require_human_on_public_api = true
require_human_on_new_unsafe = true
require_human_on_new_dependency = true
allow_raw_bash = false                # MUST stay false in every profile (PF6)

[sandbox]
check = "landlock"                    # seatbelt on macOS; "container" acceptable
test = "container"
network = "deny"                      # MUST stay deny (PF8)
quarantine_deps = true                # MUST stay true (PF8)

[budgets]
max_usd_per_run = 5.0
max_tokens_per_run = 2_000_000
max_parallel_nodes = 1                # MUST stay 1 (PF12)
max_parallel_cargo = 1                # MUST stay 1 (PF12)
max_parallel_edits = 1                # MUST stay 1 (PF12)

[context]
total_token_budget = 32_000
weights = { conversation = 0.20, working_set = 0.55, artifacts = 0.25 }

[observability]
retain_full_prompts = false
retain_tool_bodies = false

[limits]
run_timeout_secs = 1800             # ABSOLUTE bound across repair generations (RFC-0017 GN7)
max_repair_generations = 2          # 0..=8; 0 disables auto-replan (RFC-0017 AM-0015-2)

# Plan source (RFC-0017 §7.1, AM-0015-2). "llm" is opt-in and eval-gated
# (§12.4); every shipped profile stays "template" until the holdout gate
# passes. Values are the §3.3 defaults, spelled out for discoverability.
[planner]
mode = "template"            # "template" | "llm"
max_proposed_nodes = 8       # 2..=16
proposal_max_bytes = 16384   # 1024..=32768 — hard-capped under OC7's 64 KiB payload bound
planning_max_input = 16384   # tokens, planning capability call
planning_max_output = 4096
planning_timeout_ms = 120000

# Corpus capture (research §7.11 item 1) — distinct from [observability]:
# retention is what the log keeps for debugging; capture is what may enter a
# training corpus. Defaults are fail-closed: nothing captured, and capture
# (when enabled) requires per-session consent (corpus_ok).
[capture]
enabled = false
prompts = false
tool_bodies = false
require_consent = true
